{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | ChizzyHomes</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid #e5e0eb; }
        h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #120e16; }
        p { font-size: 13px; color: #656070; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border: 1px solid #e5e0eb; border-radius: 8px; font-size: 14px; margin-bottom: 16px; outline: none; box-sizing: border-box; }
        input:focus { border-color: #6c2bd9; }
        button { width: 100%; padding: 12px; background: #6c2bd9; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
        button:hover { background: #5821b6; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Password</h2>
        <p>Enter your account email address and we'll send you a link to reset your password.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit">Send Reset Link</button>
        </form>
    </div>
</body>
</html>
